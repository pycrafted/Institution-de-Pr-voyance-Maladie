<!doctype html>
<html lang="fr" dir="ltr">
  <head>
    <meta charset="UTF-8" />
    <!--
      Application exclusivement mobile, qui doit se comporter comme une
      application native : pas de zoom de page (la visionneuse PDF gère son
      propre pincement), contenu sous l'encoche (viewport-fit=cover), les
      zones sûres étant reprises par Ionic et src/theme/global.css.
    -->
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, minimum-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover"
    />
    <meta name="format-detection" content="telephone=no" />
    <meta name="msapplication-tap-highlight" content="no" />
    <meta name="color-scheme" content="light dark" />
    <meta
      name="description"
      content="Vos bons et lettres de garantie IPM SAR, sur votre téléphone."
    />

    <!--
      Couleur de la barre d'état. Les écrans n'ont plus de bandeau sombre :
      la barre se pose sur le fond de la page (--ipm-fond), et suit donc le
      mode choisi dans l'application — pas celui du téléphone. C'est
      src/theme/apparence.ts qui l'écrit ; la valeur posée ici est celle du
      mode clair, servie le temps que l'application démarre.
    -->
    <meta name="theme-color" content="#1D1D1B" />

    <!-- iOS : lancée depuis l'écran d'accueil, l'application s'ouvre en plein écran. -->
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="IPM" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="application-name" content="IPM Mobile" />

    <!-- Icônes produites à partir du logo SAR par scripts/generer-icones.py. -->
    <link rel="icon" href="/favicon.ico" sizes="48x48" />
    <link rel="icon" href="/icons/favicon-32.png" type="image/png" sizes="32x32" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.webmanifest" />

    <!--
      Écrans de lancement iOS (portrait), produits par scripts/generer-icones.py
      qui imprime aussi ces balises : les recopier si la liste change.
    -->
    <link
      rel="apple-touch-startup-image"
      href="/splash/lancement-1320x2868.png"
      media="(device-width: 440px) and (device-height: 956px) and (-webkit-device-pixel-ratio: 3) and (orientation: portrait)"
    />
    <link
      rel="apple-touch-startup-image"
      href="/splash/lancement-1206x2622.png"
      media="(device-width: 402px) and (device-height: 874px) and (-webkit-device-pixel-ratio: 3) and (orientation: portrait)"
    />
    <link
      rel="apple-touch-startup-image"
      href="/splash/lancement-1290x2796.png"
      media="(device-width: 430px) and (device-height: 932px) and (-webkit-device-pixel-ratio: 3) and (orientation: portrait)"
    />
    <link
      rel="apple-touch-startup-image"
      href="/splash/lancement-1179x2556.png"
      media="(device-width: 393px) and (device-height: 852px) and (-webkit-device-pixel-ratio: 3) and (orientation: portrait)"
    />
    <link
      rel="apple-touch-startup-image"
      href="/splash/lancement-1284x2778.png"
      media="(device-width: 428px) and (device-height: 926px) and (-webkit-device-pixel-ratio: 3) and (orientation: portrait)"
    />
    <link
      rel="apple-touch-startup-image"
      href="/splash/lancement-1170x2532.png"
      media="(device-width: 390px) and (device-height: 844px) and (-webkit-device-pixel-ratio: 3) and (orientation: portrait)"
    />
    <link
      rel="apple-touch-startup-image"
      href="/splash/lancement-1080x2340.png"
      media="(device-width: 360px) and (device-height: 780px) and (-webkit-device-pixel-ratio: 3) and (orientation: portrait)"
    />
    <link
      rel="apple-touch-startup-image"
      href="/splash/lancement-1125x2436.png"
      media="(device-width: 375px) and (device-height: 812px) and (-webkit-device-pixel-ratio: 3) and (orientation: portrait)"
    />
    <link
      rel="apple-touch-startup-image"
      href="/splash/lancement-1242x2688.png"
      media="(device-width: 414px) and (device-height: 896px) and (-webkit-device-pixel-ratio: 3) and (orientation: portrait)"
    />
    <link
      rel="apple-touch-startup-image"

    <link
      rel="apple-touch-startup-image"

    />
    <link
      rel="apple-touch-startup-image"
      href="/splash/lancement-750x1334.png"
      media="(device-width: 375px) and (device-height: 667px) and (-webkit-device-pixel-ratio: 2) and (orientation: portrait)"
    />

    <title>IPM Mobile</title>
  </head>
  <body>
    <!-- Aucun script en ligne : la CSP du site (pwa/deploy/web.config) n'autorise que 'self'. -->
    <noscript>IPM Mobile a besoin de JavaScript pour fonctionner.</noscript>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>

# Déploiement du backend IPM sur Railway.
#
# À configurer côté Railway : le service pointe sur CE dossier (Root Directory =
# « backend »), relié au dépôt GitHub `pycrafted/Institution-de-Pr-voyance-Maladie`
# (branche main), avec un plugin PostgreSQL dans le même projet. Railway injecte
# alors DATABASE_URL (lue par config/settings.py) et RAILWAY_PUBLIC_DOMAIN
# (ajouté d'office aux hôtes autorisés et au CSRF).
#
# Nixpacks détecte Python et installe requirements.txt. Avant de rendre le
# nouveau déploiement actif, `preDeployCommand` applique le schéma et rassemble
# les statiques (console d'admin servie par WhiteNoise) ; puis gunicorn démarre.

[build]
builder = "NIXPACKS"

[deploy]
# Tout est posé dans la commande de démarrage (le preDeployCommand ne
# s'exécutait pas de façon fiable) : schéma, statiques, banques, premier compte,
# puis gunicorn. Chaque étape est idempotente - relançable à chaque démarrage.
startCommand = "python manage.py migrate --noinput && python manage.py collectstatic --noinput && python manage.py seed_banques && (python manage.py createsuperuser --noinput || true) && gunicorn config.wsgi:application --bind 0.0.0.0:$PORT --workers 2 --timeout 120"
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 3
